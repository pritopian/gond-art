<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gond Scene — p5.brush</title>
<script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@3"></script>
<style>
  html, body { margin: 0; height: 100%; background: #1c1512; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 13px ui-sans-serif, system-ui, sans-serif; color: #cbb39c; }
  canvas { display: block; box-shadow: 0 8px 34px rgba(0,0,0,.5); }
  main { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; color: #ecd9c4; background: #33271f; border: 1px solid #5a4638; border-radius: 999px; padding: 6px 14px; cursor: pointer; min-width: 74px; }
  button[aria-pressed="true"] { background: #6b351b; border-color: #985e47; }
  #status { min-height: 1.2em; opacity: .8; }
</style>
</head>
<body>
<main>
  <div id="holder"></div>
  <div class="bar"><button id="play" type="button">Pause</button><button id="still" type="button" aria-pressed="false">Still</button><span id="status">painting…</span></div>
</main>
<script>
/* Gond scene painted with p5.brush. Every static surface is brushed once into a WEBGL buffer in setup (watercolour
   fills with a little bleed and paper texture, pencil and pen strokes for contours and infill); the moving parts are
   drawn each frame over those buffers. Geometry follows the Canvas 2D version in ../index.html. */
'use strict';
const W = 768, H = 1057, LOOP = 24, TAU = Math.PI * 2, PI = Math.PI, DEG = PI / 180;
const INK = '#040102', WHITE = '#F4F6F1', CREAM = '#F4F1EC';
let reducedMotion = false, playing = true, T = 0, last = 0;
const BUF = {};                                            // name -> { g, x, y, w, h } painted once
let tree, fronds = [];

/* ───── helpers (same maths as the Canvas version) ───── */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function splinePts(pts, seg = 10) {

    for (let j = 0; j < seg; j++) { const t = j / seg, t2 = t * t, t3 = t2 * t, o = [0, 0]; for (let k = 0; k < 2; k++) o[k] = .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3); out.push(o); }
  }

}
function resample(pts, sp) {

  for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]); if (!d) continue; while (next <= acc + d) { const t = (next - acc) / d; out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, (b[0] - a[0]) / d, (b[1] - a[1]) / d]); next += sp; } acc += d; }

}

const ease = u => u * u * (3 - 2 * u);
const wave = (t, per, ph) => Math.sin(TAU * t / per + ph);
const look = (t, per, ph) => Math.tanh(1.7 * Math.sin(TAU * t / per + ph)) / Math.tanh(1.7);
function keyVal(keys, t) { t = ((t % LOOP) + LOOP) % LOOP; for (let i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1][0]) { const a = keys[i], b = keys[i + 1]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])); } return keys[keys.length - 1][1]; }
const gustAt = t => reducedMotion ? 0 : Math.exp(-Math.pow((t - 9.7) / 1.7, 2));
const swayAt = t => reducedMotion ? 0 : (.9 * Math.sin(TAU * t / 8) + gustAt(t) * 2.6 * Math.sin(TAU * t / 2.4)) * DEG;
const surfY = x => 850 + 10 * Math.sin(x / 61 + .6) + 4 * Math.sin(x / 23 + 2);
const bankY = x => 776 - 16 * Math.exp(-Math.pow((x - 470) / 260, 2)) + 10 * Math.sin(x / 71 + 1) + 3 * Math.sin(x / 27);

/* ───── brush idiom: flat wash, a breath of texture, pencil contour ───── */
function flat(col, pts, o = {}) {                          // Gond colour is flat: a wash, then a faint textured fill for paper grain
  brush.noStroke(); brush.noHatch(); brush.wash(col); brush.polygon(pts); brush.noWash();
  if (o.grain !== false) { brush.fill(col, 60); brush.fillBleed(.04, 'in'); brush.fillTexture(.7, .3); brush.polygon(pts); brush.noFill(); }

function contour(pts, lw, pen, col, closed) {

}
function pen(col, lw, name = 'pen') { brush.noFill(); brush.noWash(); brush.pick(name); brush.stroke(col); brush.strokeWeight(lw); }

function smoothClosed(pts, k = 1) {                        // Catmull-Rom through a closed control polygon, as points

  return out;
}
function pearls(pts, gap, r, col = CREAM, band = 0, clip = null) {
  const d = splinePts(pts, 8), keep = p => !clip || inPoly(p[0], p[1], clip);
  if (band) { pen(INK, band, 'marker'); let run = []; for (const p of d) { if (keep(p)) run.push(p); else { if (run.length > 1) brush.spline(run, .3); run = []; } } if (run.length > 1) brush.spline(run, .3); }

}
// buffers: each piece gets a fresh WEBGL canvas of its own size (p5.brush keeps compositing everything ever drawn on
// a canvas, so a shared one would leak earlier pieces), is copied to a plain 2D canvas, and the WebGL context is then
// released so the browser's limit on live contexts is never reached
let pending = null;
function paintBuffer(name, x, y, w, h, fn) {
  w = Math.ceil(w); h = Math.ceil(h);
  const g = createGraphics(w, h, WEBGL); g.pixelDensity(pixelDensity());
  brush.load(g);
  g.push(); g.translate(-w / 2 - x, -h / 2 - y); fn(g); g.pop();

}
function finishBuffer() {
  if (!pending) return; const { name, x, y, w, h, g: src } = pending, pd = src.pixelDensity();
  const g = createGraphics(w, h); g.pixelDensity(pd); const img = src.get(0, 0, w, h);
  img.loadPixels(); const px = img.pixels;                  // WebGL hands back premultiplied colour: undo it, or edges go pale

}
function show(name, dx = 0, dy = 0) { const b = BUF[name]; image(b.g, b.x + dx, b.y + dy, b.w, b.h); }
function showXf(name, px, py, ang, sx = 1) { const b = BUF[name]; push(); translate(px, py); rotate(ang); scale(sx, 1); translate(-px, -py); image(b.g, b.x, b.y, b.w, b.h); pop(); }

/* ───── paper ───── */
function paintPaper() {
  const r = rng(11);
  brush.noStroke(); brush.wash('#F5D3B2'); brush.rect(-10, -10, W + 20, H + 20); brush.noWash();
  brush.fill('#E8C19C', 22); brush.fillBleed(.2, 'out'); brush.fillTexture(.9, .1);
  for (let i = 0; i < 5; i++) brush.circle(r() * W, r() * H, 140 + r() * 120);
  brush.fill('#FBE3C8', 22); for (let i = 0; i < 5; i++) brush.circle(r() * W, r() * H, 140 + r() * 120);
  brush.noFill();
}

/* ───── tree ───── */
const LIMBS = [
  { p: [[438, 822], [433, 700], [430, 560], [429, 470], [427, 420], [423, 372], [420, 340]], w: 60, trunk: true },
  { p: [[428, 440], [392, 410], [346, 384], [300, 371], [262, 371], [236, 384], [210, 405], [166, 424], [136, 410], [118, 384]], w: 26 },
  { p: [[265, 367], [240, 345], [215, 326], [176, 320], [142, 350], [106, 384], [78, 380], [64, 356]], w: 20 },
  { p: [[215, 326], [168, 302], [122, 280], [88, 258], [75, 246]], w: 16 },
  { p: [[150, 296], [104, 306], [78, 300], [66, 288]], w: 12 },
  { p: [[418, 346], [380, 318], [340, 298], [300, 278], [272, 258], [256, 226], [250, 188], [245, 150]], w: 23 },
  { p: [[245, 153], [212, 140], [186, 116], [175, 86], [197, 61]], w: 16 },
  { p: [[245, 153], [264, 118], [275, 86], [267, 60]], w: 14 },
  { p: [[256, 219], [216, 222], [168, 230], [138, 212], [128, 168]], w: 16 },
  { p: [[420, 346], [410, 290], [398, 238], [384, 196], [360, 168], [337, 125], [313, 76], [300, 32]], w: 26 },
  { p: [[330, 106], [348, 72], [358, 40]], w: 13 },
  { p: [[398, 242], [420, 200], [440, 165], [446, 125], [430, 98], [404, 66], [408, 44], [429, 22]], w: 20 },
  { p: [[446, 126], [480, 106], [510, 75]], w: 13 },
  { p: [[430, 392], [452, 330], [458, 270], [470, 212], [490, 186]], w: 18 },
  { p: [[455, 305], [498, 292], [520, 256], [521, 215]], w: 14 },
  { p: [[432, 470], [466, 430], [504, 396], [543, 376], [588, 400], [628, 430], [668, 442], [700, 424]], w: 25 },
  { p: [[565, 386], [608, 396], [648, 382], [684, 356]], w: 14 },
  { p: [[540, 378], [553, 350], [563, 310], [573, 270], [588, 212], [578, 160], [568, 126], [587, 100]], w: 20 },
  { p: [[566, 303], [628, 306], [673, 297], [695, 258]], w: 14 },
  { p: [[586, 217], [628, 200], [660, 175]], w: 13 },
  { p: [[668, 442], [706, 452], [730, 482], [728, 520], [706, 542], [668, 548], [640, 540]], w: 16 },
  { p: [[424, 812], [398, 822], [368, 836], [344, 840]], w: 22, root: true },
  { p: [[450, 812], [478, 824], [508, 834], [534, 836]], w: 22, root: true }

const limbW = L => L.trunk ? (t => 34 + 30 * Math.pow(1 - t, 1.4) + 46 * Math.pow(Math.max(0, 1 - t / .09), 2)) : L.root ? (t => Math.max(.6, L.w * Math.pow(1 - t, .7))) : (t => Math.max(.5, L.w * 1.05 * Math.pow(1 - t, 1.05)));

    else { const na = Math.atan2(p[2] * cd.sd, -p[3] * cd.sd), ra = Math.atan2(p[1] - 345, p[0] - 420); let d = ra - na; while (d > PI) d -= TAU; while (d < -PI) d += TAU; ang = na + d * .42 + (r() - .5) * .5; }

function paintTree() {

/* ───── bank and water ───── */
function paintGrass() {
  const r = rng(616), pts = [[-12, 890]]; for (let x = -12; x <= W + 12; x += 8) pts.push([x, bankY(x)]); pts.push([W + 12, 890]);
  brush.noStroke(); brush.wash('#8FA466'); brush.polygon(pts); brush.noWash();
  brush.noFill(); brush.hatch(9, 80, { rand: .3, continuous: false }); brush.hatchStyle('pen', '#2F5E2A', 1.4); brush.polygon(pts); brush.noHatch();
  pen('#D9DDA2', 1, 'marker'); for (let i = 0; i < 420; i++) { const x = -10 + r() * (W + 20), y = bankY(x) + 8 + r() * 100; brush.line(x, y, x + 1, y - 7); }
  pen(INK, 2.2, 'HB'); brush.spline(pts.slice(1, -1), .2);
  for (let x = -6; x <= W + 6; x += 9) dotp(x, bankY(x) + 7, 2, '#F0D24A');
  pen('#2F5E2A', 1.6, '2B'); for (let x = 4; x < W; x += 15 + r() * 14) for (const k of [-1, 0, 1]) { const a = -PI / 2 + k * .4, l = 13 + r() * 7; brush.line(x, bankY(x) + 1, x + Math.cos(a) * l, bankY(x) + 1 + Math.sin(a) * l); }
}
function waterPts() { const pts = [[-12, H + 12]]; for (let x = -12; x <= W + 12; x += 6) pts.push([x, surfY(x)]); pts.push([W + 12, H + 12]); return pts; }
function paintWater() {
  const r = rng(700), tones = ['#2B5BC4', '#3F86D6', '#16307E', '#7DB7E6', '#1C6E8C', '#1F3FA6'], edges = ['#F0D24A', '#E08A3C', '#F4F3EE', '#7FC4E8'];
  brush.noStroke(); brush.wash('#1B3E9C'); brush.polygon(waterPts()); brush.noWash();
  const rows = []; let ti = 0, li = 0;
  for (let k = 0; k < 6; k++) { const yc = 846 + 36 * k, row = []; let x = -160 + (k % 2) * 130 + r() * 40; while (x < W + 60) { const len = 230 + r() * 120, h = 46 + r() * 18, tilt = (r() - .5) * .16; ti = (ti + 1 + ((r() * 3) | 0)) % tones.length; row.push({ x, y: yc + (r() - .5) * 14, len, h, tilt, tone: tones[ti], i: li++ }); x += len * (.62 + r() * .1); } rows.push(row); }

    const P0 = [L.x, L.y], P1 = [L.x + L.len, L.y + L.tilt * L.len], dx = P1[0] - P0[0], dy = P1[1] - P0[1], d = Math.hypot(dx, dy), nx = -dy / d, ny = dx / d;

    brush.noStroke(); brush.fill(L.tone, 235); brush.fillBleed(.08, 'out'); brush.fillTexture(.5, .25); brush.polygon(lens); brush.noFill();
    pen('#0B1640', .9, 'pen');
    const R = 14, ang = Math.atan(L.tilt); let row = 0;

  const e = P(R([[1, -1]]))[0]; dotp(e[0], e[1], 6.5, INK); dotp(e[0], e[1], 5, '#F1F1EC'); dotp(e[0], e[1], 3.2, INK); dotp(e[0], e[1], 1.6, '#8A8A84');

function fanWing(s, col, col2, fly, t, ph) {              // flight: both wings raised as feather fans (plain p5 per frame)

function birdState(b, gi, t) {
  const perched = { x: b.x, y: b.y, fly: 0, face: 0, rot: 0 }; if (reducedMotion) return perched;
  const out0 = 9 + .05 * gi, outDur = 1.8, back0 = 13 + .78 * gi, backDur = 2.2; if (t < out0 || t > back0 + backDur) return perched;
  const dir = gi < 6 ? 1 : -1, k = .78 + .05 * (gi % 5), orbit = tt => { const a = dir * TAU * (tt - 9) / 6.5 + gi * TAU / 10; return [384 + Math.cos(a) * 318 * k, 272 + Math.sin(a) * 196 * k + 14 * Math.sin(TAU * tt / 1.7 + gi)]; };
  const pos = tt => { const o = orbit(tt); if (tt < out0 + outDur) { const u = ease(Math.max(0, (tt - out0) / outDur)); return [b.x + (o[0] - b.x) * u, b.y + (o[1] - b.y) * u]; } if (tt > back0) { const u = ease(Math.min(1, (tt - back0) / backDur)); return [o[0] + (b.x - o[0]) * u, o[1] + (b.y - o[1]) * u]; } return o; };

const FISH = [{ cx: 250, y: 918, ax: 175, per: 24, ph: 0, len: 80, col: '#C2261E', mark: '#F6E3DC' }, { cx: 520, y: 968, ax: 190, per: 24, ph: 2.4, len: 72, col: '#E0622A', mark: '#F8ECD8' }, { cx: 390, y: 1014, ax: 240, per: 24, ph: 4.4, len: 64, col: '#D99013', mark: '#3A1E0A' }, { cx: 610, y: 902, ax: 115, per: 12, ph: 1.2, len: 56, col: '#F2C4C0', mark: '#B83F56' }];
function paintFish(F) {                                    // facing right, origin at the body centre

  const rb = ribbon(body, u => L * .36 * Math.sin(PI * (.12 + .8 * u)) * (1 - .5 * u)), e = body[14];
  flat('#8FA873', [[e[0], e[1]], [e[0] - L * .3, -L * .17], [e[0] - L * .13, 0], [e[0] - L * .3, L * .17]], { grain: false, lw: 1.1 });
  flat('#8FA873', [rb.L[4], [(rb.L[4][0] + rb.L[8][0]) / 2 - L * .06, (rb.L[4][1] + rb.L[8][1]) / 2 - L * .2], rb.L[8]], { grain: false, lw: 1 });
  flat('#8FA873', [rb.R[4], [(rb.R[4][0] + rb.R[8][0]) / 2 - L * .06, (rb.R[4][1] + rb.R[8][1]) / 2 + L * .12], rb.R[8]], { grain: false, lw: 1 });
  flat(F.col, rb.outline, { lw: 1.4 });
  for (let i = 4; i <= 14; i++) for (const f of (i % 2 ? [.3, .7] : [.14, .5, .86])) dotp(rb.L[i][0] + (rb.R[i][0] - rb.L[i][0]) * f, rb.L[i][1] + (rb.R[i][1] - rb.L[i][1]) * f, L * .028, F.mark);
  flat('#A9C08F', rb.L.slice(0, 5).concat(rb.R.slice(0, 5).reverse()), { grain: false, line: false });
  pen('#F4F3EE', 1.8, 'pen'); brush.line(rb.L[4][0], rb.L[4][1], rb.R[4][0], rb.R[4][1]);
  const ex = body[2][0] + L * .02, ey = -L * .03, r = L * .085; dotp(ex, ey, r, INK); dotp(ex, ey, r * .78, '#F1F1EC'); dotp(ex, ey, r * .5, INK);
}
function paintTurtle() {                                   // origin at the shell centre, facing right
  for (const f of [[-38, -26, -65, 30], [-36, 18, 195, 32], [30, -26, -15, 30], [32, 20, 15, 30]]) { const a = f[2] * DEG, L = f[3], c = Math.cos(a), s = Math.sin(a), pts = [[0, -6], [.5 * L, -5], [.8 * L, -11], [.8 * L, -3], [L, 0], [.8 * L, 3], [.8 * L, 11], [.5 * L, 5], [0, 6]].map(p => [f[0] + p[0] * c - p[1] * s, f[1] + p[0] * s + p[1] * c]); flat('#8FA873', pts, { grain: false, lw: 1.1 }); }
  flat('#A9C08F', ell(-44, 6, 14, 13), { lw: 1.1 });
  flat(INK, ell(0, 0, 38, 37, 18), { lw: 1.2 }); const r = rng(81); for (let i = 0; i < 40; i++) { const a = r() * TAU, d = Math.sqrt(r()) * 31; dotp(Math.cos(a) * d, Math.sin(a) * d, 2.4, '#F2F2EE'); }
  flat('#A9C08F', ell(48, -22, 18, 17), { lw: 1.2 }); for (const e of [[44, -29], [53, -15]]) { dotp(e[0], e[1], 7, INK); dotp(e[0], e[1], 5.4, '#F1F1EC'); dotp(e[0], e[1], 3.2, INK); }
}

/* ───── leaves, ripples ───── */
const FALL = []; { const r = rng(999); for (let i = 0; i < 30; i++) { const x = 60 + r() * 650, dry = i % 3 === 0; FALL.push({ x, y: 130 + r() * 290, gy: dry ? bankY(x) + 10 + r() * (850 - bankY(x) - 22) : surfY(x) + 3, wet: !dry, t0: i < 22 ? 8.9 + r() * 2.6 : r() * 24, dur: 8 + r() * 3, sw: 14 + r() * 22, sp: r() * TAU, tilt: (r() - .5) * 1.5 + (r() < .5 ? 0 : PI), rest: (r() - .5) * .5, l: 17 + r() * 6 }); } }
const LEAF_COLS = [[244, 246, 241], [169, 199, 122], [224, 162, 28], [181, 86, 43]];
function leafCol(k) { const x = Math.min(.999, Math.max(0, k)) * 3, i = Math.floor(x), f = x - i, a = LEAF_COLS[i], b = LEAF_COLS[i + 1]; return color(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f); }
function drawFalling(t) {
  if (reducedMotion) return;
  for (const f of FALL) {
    const u = (((t - f.t0) % LOOP + LOOP) % LOOP) / f.dur; if (u >= 1) continue;
    const fall = Math.min(1, u / .55), land = ease(Math.max(0, (fall - .82) / .18)), after = Math.max(0, (u - .55) / .45), melt = f.wet ? Math.min(1, after / .5) : 0;
    const alpha = Math.min(1, u / .05) * (f.wet ? 1 - melt : Math.min(1, (1 - u) / .1)); if (alpha <= .01) continue;
    const y = f.y + (f.gy - f.y) * (.75 * fall + .25 * fall * fall), x = f.x + Math.sin(fall * 6 + f.sp) * f.sw * (1 - land), a = (f.tilt + Math.sin(fall * 11 + f.sp) * .5) * (1 - land) + f.rest * land, l = f.l;
    push(); translate(x, y); rotate(a); if (melt) scale(1 - melt * .45);

    beginShape(); for (let q = 0; q <= 8; q++) vertex(l * q / 8, 6.2 * Math.sin(PI * q / 8)); for (let q = 8; q >= 0; q--) vertex(l * q / 8, -6.2 * Math.sin(PI * q / 8)); endShape(CLOSE);

function drawRipples(t) {

  for (const K in DEER) { const m = DEER[K].muzzle; if (!m || m[1] < surfY(m[0]) - 2) continue; const e = Math.min(1, (m[1] - surfY(m[0]) + 2) / 8), cx = m[0] + 4, cy = surfY(cx) + 5;
    for (let k = 0; k < 5; k++) { const p = ((t * .42 + k / 5) % 1), rx = 10 + p * 90; stroke(226 - 196 * p, 242 - 178 * p, 248 - 78 * p, 255 * Math.pow(1 - p, .7) * e); strokeWeight(3.2 - 2 * p); ellipse(cx, cy, rx * 2, rx * .52); } }
}

/* ───── p5 lifecycle ───── */
function setup() {
  const holder = document.getElementById('holder'), c = createCanvas(W, H, WEBGL); c.parent(holder); pixelDensity(Math.min(window.devicePixelRatio || 1, 2)); angleMode(DEGREES);
  randomSeed(7); noiseSeed(7); brush.scaleBrushes(2.2);
  fitCanvas(); window.addEventListener('resize', fitCanvas);
  buildTree();

  for (const K in DEER) { const D = DEER[K]; jobQueue.push(() => paintBuffer('body' + K, Math.min(D.x - 30 * D.s * D.f, D.x + 290 * D.s * D.f) - 20, D.y - 190 * D.s - 20, 320 * D.s + 40, 200 * D.s + 40, g => { g.translate(D.x, D.y); g.scale(D.s * D.f, D.s); paintDeerBody(D); })); jobQueue.push(() => paintBuffer('head' + K, 330, 350, 230, 170, () => paintHead(D))); }

  SMALL_BIRDS.forEach((b, i) => jobQueue.push(() => paintBuffer('sb' + i, -110, -150, 170, 160, () => paintSmallBird(b))));
  FISH.forEach((F, i) => jobQueue.push(() => paintBuffer('fish' + i, -F.len * .7, -F.len * .4, F.len * 1.3, F.len * .8, () => paintFish(F))));
  jobQueue.push(() => paintBuffer('turtle', -80, -50, 160, 100, paintTurtle));
  jobTotal = jobQueue.length;
  document.getElementById('play').addEventListener('click', e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; });
  document.getElementById('still').addEventListener('click', e => { reducedMotion = !reducedMotion; e.target.setAttribute('aria-pressed', String(reducedMotion)); });
}
let ready = false, jobQueue = [], jobTotal = 1;
function fitCanvas() { const availW = window.innerWidth - 20, availH = window.innerHeight - 64, cssW = Math.max(160, Math.min(availW, availH * W / H)); const el = document.querySelector('#holder canvas'); if (el) { el.style.width = cssW + 'px'; el.style.height = (cssW * H / W) + 'px'; } }
function draw() {

  }

  show('paper'); show('grass');
  push(); translate(438, 822); rotate(sway); translate(-438, -822); show('tree'); pop();
  show('water');
  // swimmers behind the weeds
  FISH.forEach((F, i) => { const a = TAU * t / F.per + F.ph, vx = Math.cos(a), face = reducedMotion ? 1 : Math.max(-1, Math.min(1, vx * 6)); push(); translate(F.cx + F.ax * Math.sin(a) * (reducedMotion ? 0 : 1), F.y + 6 * Math.sin(TAU * t / 6 + F.ph)); rotate(.12 * Math.sin(TAU * t / 6 + F.ph + 1.2) * face); scale(Math.abs(face) < .04 ? .04 : face, 1); const b = BUF['fish' + i]; image(b.g, b.x, b.y, b.w, b.h); pop(); });
  { const a = TAU * t / 24 + 1, face = reducedMotion ? 1 : Math.max(-1, Math.min(1, Math.cos(a) * 6)); push(); translate(150 + 100 * Math.sin(a), 990 + 5 * Math.sin(TAU * t / 8)); rotate(.07 * Math.sin(TAU * t / 4) * face); scale(.7 * (Math.abs(face) < .04 ? .04 : face), .7); const b = BUF.turtle; image(b.g, b.x, b.y, b.w, b.h); pop(); }

}

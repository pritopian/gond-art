  left: { layer: 'ln', sign: -1, down: 34, up: 9, hd: 24, hu: 14, pts: Q([[210, 696], [205, 652], [196, 606], [182, 566], [168, 530]]),
    keys: [[0, 0], [5, 0], [7.4, 1], [10.6, 1], [12.6, -.7], [16, -.7], [18, 0], [24, 0]] },
  right: { layer: 'rn', sign: 1, down: 27, up: 9, hd: 27, hu: 14, pts: Q([[492, 628], [508, 601], [526, 576], [542, 556]]),
    keys: [[0, 0], [1, 0], [3, -.8], [6, -.8], [8, 0], [10, 0], [12.4, 1], [16, 1], [18.2, 0], [24, 0]] }
};
const COW_KEYS = [[0, .3], [3, 1], [7, 1], [9, -.9], [12, -.9], [14, .3], [17, 1], [21, 1], [23, .3], [24, .3]];
function keyVal(keys, t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  for (let i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1][0]) { const a = keys[i], b = keys[i + 1]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])); }
  return keys[keys.length - 1][1];
}
function pose(ch, t) {
  if (reducedMotion) return { n: 0, h: 0 };
  const v = keyVal(ch.keys, t), vh = keyVal(ch.keys, t - .3);
  const nib = vh > .9 ? Math.sin(TAU * t * 1.5) * 2.4 : 0;                                  // nibbling while the head is down
  return { n: ch.sign * (v > 0 ? ch.down * v : ch.up * v) * DEG, h: ch.sign * ((vh > 0 ? ch.hd * vh : ch.hu * vh) + nib) * DEG };
}
function chainXf(c, ch, n, upto) {
  const k = ch.pts.length - 1;
  for (let j = 0; j <= upto; j++) { const p = ch.pts[j]; c.translate(p[0], p[1]); c.rotate(n / k); c.translate(-p[0], -p[1]); }
}
function drawNeck(key, t) {
  const ch = CHAINS[key], l = layers[ch.layer + 0], P = ch.pts, k = P.length - 1, n = pose(ch, t).n;
  for (let i = 0; i < k; i++) {
    const a = P[i], b = P[i + 1]; let dx = b[0] - a[0], dy = b[1] - a[1]; const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    const s0 = i === 0 ? -400 : -14, s1 = i === k - 1 ? 400 : len + 10;
    ctx.save(); chainXf(ctx, ch, n, i);
    ctx.beginPath(); ctx.moveTo(a[0] + dx * s0 - dy * 300, a[1] + dy * s0 + dx * 300); ctx.lineTo(a[0] + dx * s1 - dy * 300, a[1] + dy * s1 + dx * 300);
    ctx.lineTo(a[0] + dx * s1 + dy * 300, a[1] + dy * s1 - dx * 300); ctx.lineTo(a[0] + dx * s0 + dy * 300, a[1] + dy * s0 - dx * 300); ctx.closePath(); ctx.clip();
    ctx.drawImage(l.cv, l.ox / S, l.oy / S, l.cv.width / S, l.cv.height / S); ctx.restore();
  }
}
function swim(t, per, ph, ax, ay, rot, px, py, fn, sc = 1, dx = 0, dy = 0) {   // creatures in the water drift and tip a little
  const p = q1(px, py); ctx.save(); ctx.translate(p[0] + dx + wave(t, per, ph) * ax, p[1] + dy + wave(t, per / 2, ph + 1) * ay); ctx.rotate(wave(t, per, ph + .8) * rot * DEG); ctx.scale(sc, sc); ctx.translate(-p[0], -p[1]); fn(); ctx.restore();
}
function ground(v) { const g = GROUND[v]; if (g) { ctx.fillStyle = `rgba(${g[0]},${g[1]},${g[2]},.9)`; ctx.fillRect(0, 0, W, H); } }

function render(t) {
  setWipe(t); SWAY = swayAt(t);
  blit('paper');
  blit('grass');                                           // first, so trunk and roots stand on it
  // the whole tree leans with the wind about its foot; fronds add their own flutter
  ctx.save(); ctx.translate(SWAY_BASE[0], SWAY_BASE[1]); ctx.rotate(SWAY); ctx.translate(-SWAY_BASE[0], -SWAY_BASE[1]);
  const sx = ctx.getTransform();
  const lay = n => { const l = layers[n + 0]; ctx.drawImage(l.cv, l.ox / S, l.oy / S, l.cv.width / S, l.cv.height / S); };
  lay('bands');
  for (const f of tree.fronds) drawFrond(ctx, f, t);
  lay('tree');
  ctx.restore();
  blit('tufts');
  blit('water');
  for (const F of FISH) swimFish(ctx, F, t);               // fish and tortoise first: they pass behind the stems
  swimTurtle(ctx, t);
  WEEDS.forEach((P, i) => blitXf('weed' + i, [P[0], H + 6], reducedMotion ? 0 : (.035 * Math.sin(TAU * t / 8 + i * 1.3) + .012 * Math.sin(TAU * t / 3 + i)) * (P[1] > 200 ? .6 : 1)));
  blit('waterFront');                                      // some wave lobes lie in front of the fish and stems, behind the deer
  drawDeerFull('A', t);
  drawDeerFull('B', t);
  drawWaterVeil(ctx, t);                                   // depth-graded tint: a dipped muzzle shows through, only faintly blued
  drawRipples(ctx, t);
  for (const b of SMALL_BIRDS) gondBird(ctx, b, t);
  TREE_BIRDS.forEach((b, i) => blackBird(ctx, b, i, t));
  drawFalling(ctx, t);
  drawSun(ctx, t);
}

let T = 0, last = 0;
window.gondTime = (n = 20) => { const t0 = performance.now(); for (let i = 0; i < n; i++) render((i * 1.2) % LOOP); return (performance.now() - t0) / n; };
window.gondSeek = v => { T = ((v % LOOP) + LOOP) % LOOP; dirty = true; };   // jump to a moment in the loop (seconds)
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || dt > .1) dt = 1 / 60;                   // clamp after tab suspension
  const moving = playing && !reducedMotion;
  if (moving) { const prev = T; T = (T + dt) % LOOP; if (T < prev) snd.lastT = -1; soundUpdate(T, dt); }
  if (moving || dirty) { render(reducedMotion ? 0 : T); dirty = false; }
  requestAnimationFrame(frame);
}

const playBtn = document.getElementById('play'), stillBtn = document.getElementById('still');
function syncUI() {
  playBtn.textContent = playing ? 'Pause' : 'Play';
  playBtn.disabled = reducedMotion; playBtn.style.opacity = reducedMotion ? .45 : 1;
  stillBtn.setAttribute('aria-pressed', String(reducedMotion));
}
playBtn.addEventListener('click', () => { playing = !playing; syncUI(); });
stillBtn.addEventListener('click', () => { reducedMotion = !reducedMotion; dirty = true; syncUI(); });
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  try {
    if (!snd.ac) soundStart(); else if (snd.ac.state === 'suspended') snd.ac.resume();
    snd.on = !snd.on; snd.master.gain.setTargetAtTime(snd.on ? .9 : 0, snd.ac.currentTime, .3);
  } catch (e) { snd.on = false; }
  soundBtn.setAttribute('aria-pressed', String(snd.on));
});
document.getElementById('theme').addEventListener('change', e => { theme = THEMES[e.target.value] || THEMES.earth; resize(); });
let rz = 0;
const onSize = () => { clearTimeout(rz); rz = setTimeout(resize, 120); };
window.addEventListener('resize', onSize); window.addEventListener('load', onSize);
if (window.ResizeObserver) new ResizeObserver(onSize).observe(document.documentElement);

buildTree(); resize(); syncUI();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
